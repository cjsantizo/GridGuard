<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

    <!-- Leaflet Marker Cluster -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />

    <!-- Leaflet JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/form.css">

    <style>
        /* Map inside the Add New Project dialog */
        #projectMap {
            height: 300px;
            width: 100%;
        }
    </style>
</head>

<body>

  

    <div id="map" style="height: 400px;"></div>



    <div class="center-container">

        <form id="filter-bar">

            <label>
                State
                <select id="f-state">
                    <option value="">All</option>
                    <option>GA</option>
                    <option>SC</option>
                    <option>NC</option>
                    <option>FL</option>
                    <option>AL</option>
                    <option>TN</option>
                </select>
            </label>

            <label>
                Where
                <input
                    id="f-where"
                    type="text"
                    placeholder="City"
                />
            </label>

            <label>
                Type
                <select id="f-type">
                    <option value="">All</option>
                    <option value="Substation Upgrade">Substation Upgrade</option>
                    <option value="Transmission Line Extension">Transmission Line</option>
                    <option value="Grid Hardening">Grid Hardening</option>
                    <option value="Solar Interconnection">Solar Tie-In</option>
                </select>
            </label>

            <label>
                Month
                <select id="f-start-month">
                    <option value="1" selected>Jan</option>
                    <option value="2">Feb</option>
                    <option value="3">Mar</option>
                    <option value="4">Apr</option>
                    <option value="5">May</option>
                    <option value="6">Jun</option>
                    <option value="7">Jul</option>
                    <option value="8">Aug</option>
                    <option value="9">Sep</option>
                    <option value="10">Oct</option>
                    <option value="11">Nov</option>
                    <option value="12">Dec</option>
                </select>
            </label>

            <label>
                Year
                <input
                    id="f-year"
                    type="number"
                    min="2024"
                    max="2040"
                    value="2027"
                />
            </label>

            <button type="submit">Enter</button>

        </form>

    </div>


   
    <!-- new project-->
    <div class="new-project-container">
      <button class="new-project-btn" id="newProjectBtn">
          <span>+</span> New Project
      </button>
    </div>


  

    <dialog id="projectDialog">

        <div class="header">

            <h3>Add New Project</h3>

            <p>
                Enter utility construction details for grid overlap analysis.
            </p>

        </div>


        <!-- PROJECT FORM -->

        <form id="projectForm">

            <!-- Company -->
            <div class="form-group">

                <label for="companyName">
                    Company Name
                </label>

                <input
                    type="text"
                    id="companyName"
                    placeholder="e.g., Florida Power & Light"
                    required
                >

            </div>


            <!-- Project Name -->
            <div class="form-group">

                <label for="projectName">
                    Project Name
                </label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="e.g., Substation Alpha Upgrade"
                    required
                >

            </div>


            <!-- Type + State -->
            <div class="form-row">

                <div class="form-group">

                    <label for="projectType">
                        Type
                    </label>

                    <select id="projectType" required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="Substation Upgrade">
                            Substation Upgrade
                        </option>

                        <option value="Transmission Line Extension">
                            Transmission Line
                        </option>

                        <option value="Grid Hardening">
                            Grid Hardening
                        </option>

                        <option value="Solar Interconnection">
                            Solar Tie-In
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <select id="state" required>

                        <option value="">
                            Select State
                        </option>

                        <option value="FL">
                            Florida (FL)
                        </option>

                        <option value="GA">
                            Georgia (GA)
                        </option>

                        <option value="AL">
                            Alabama (AL)
                        </option>

                        <option value="NC">
                            North Carolina (NC)
                        </option>

                    </select>

                </div>

            </div>


            <!-- ========================= -->
            <!-- PROJECT LOCATION          -->
            <!-- ========================= -->

            <div class="form-group">

                <label for="coordinates">
                    Project Location
                </label>

                <input
                    type="text"
                    id="coordinates"
                    readonly
                    placeholder="Click a location on the map"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Select location on map
                </label>

                <div id="projectMap"></div>

            </div>


            <!-- Start Month + Year -->
            <div class="form-row">

                <div class="form-group">

                    <label for="startMonth">
                        Start Month
                    </label>

                    <select id="startMonth" required>

                        <option value="">
                            Select Month
                        </option>

                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="startYear">
                        Start Year
                    </label>

                    <select id="startYear" required>

                        <option value="">
                            Select Year
                        </option>

                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                        <option value="2029">2029</option>
                        <option value="2030">2030</option>
                        <option value="2031">2031</option>
                        <option value="2032">2032</option>
                        <option value="2033">2033</option>
                        <option value="2034">2034</option>
                        <option value="2035">2035</option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->
            <div class="actions">

                <button
                    type="button"
                    class="btn-cancel"
                    id="cancelBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn-save"
                >
                    Save Project
                </button>

            </div>

        </form>

    </dialog>


    <!-- ========================= -->
    <!-- PROJECT LIST              -->
    <!-- ========================= -->

    <section id="list-section">

        <h2>Projects List</h2>

        <ul id="project-list">
        </ul>

    </section>


    <!-- FORM JAVASCRIPT -->
    <script src="js/form.js" defer></script>
    <script src="js/map.js" defer></script>


</body>
</html>
